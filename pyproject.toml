[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leukemia-pp"
version = "1.0.0"
description = "Reproducible preprocessing, WBC instance segmentation and feature extraction for leukemia microscopy images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
audit = ["scikit-learn>=1.3"]
ml = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "scikit-learn>=1.3", "scipy>=1.10"]
dev = ["pytest>=7", "ruff>=0.4", "scikit-learn>=1.3", "torch>=2.2", "torchvision>=0.17", "timm>=1.0"]

[project.scripts]
leukemia-pp = "leukemia_pp.cli:main"
leukemia-ml = "leukemia_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
